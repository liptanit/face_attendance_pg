{% extends "layout.html" %}
{% block content %}
  <h1>Enroll (Webcam)</h1>
  <div class="card">
    <div><b>{{ emp.emp_code }}</b> — {{ emp.full_name }}</div>
    <p>Capture 15–25 images (front + slight left/right). Then finalize.</p>

    <div class="enroll-grid">
      <div>
        <video id="video" autoplay playsinline></video>
        <div class="row">
          <button id="btnStart" type="button">Start camera</button>
          <button id="btnCapture" type="button" disabled>Capture</button>
          <button id="btnFinalize" type="button" disabled>Finalize</button>
        </div>
        <hr style="border-color:#22335a; opacity:.6; margin:10px 0;" />
        <div class="row" style="align-items:end; gap:10px;">
          <div style="min-width:320px;">
            <label style="margin:0 0 6px 0;">Import images from file</label>
            <input id="fileImages" type="file" accept="image/*" multiple />
          </div>
          <button id="btnUploadFiles" type="button">Upload selected images</button>
        </div>
        <div class="muted" id="status">Session: {{ session_id }}</div>
      </div>
      <div>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>
  </div>

  <script>
    const sessionId = "{{ session_id }}";
    const video = document.getElementById("video");
    const btnStart = document.getElementById("btnStart");
    const btnCapture = document.getElementById("btnCapture");
    const btnFinalize = document.getElementById("btnFinalize");
    const statusEl = document.getElementById("status");
    const thumbs = document.getElementById("thumbs");
    const fileImages = document.getElementById("fileImages");
    const btnUploadFiles = document.getElementById("btnUploadFiles");

    let stream = null;
    let count = 0;

    async function startCam(){
      stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
      video.srcObject = stream;
      btnCapture.disabled = false;
      statusEl.textContent = "Camera started.";
    }

    async function uploadBlob(blob, filename = "frame.jpg"){
      const form = new FormData();
      form.append("file", blob, filename);

      const r = await fetch(`/api/enroll/${sessionId}/upload`, {method: "POST", body: form});
      const j = await r.json();
      if(!j.ok){
        throw new Error(j.error || "upload failed");
      }
      count = j.count;

      const img = document.createElement("img");
      img.src = URL.createObjectURL(blob);
      thumbs.prepend(img);

      statusEl.textContent = `Captured/Imported: ${count}`;
      if(count >= 10) btnFinalize.disabled = false;
    }

    async function capture(){
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);

      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));
      await uploadBlob(blob, "frame.jpg");
    }

    async function uploadSelectedFiles(){
      const files = Array.from(fileImages.files || []);
      if(files.length === 0){
        alert("กรุณาเลือกรูปก่อน");
        return;
      }

      btnUploadFiles.disabled = true;
      statusEl.textContent = `Uploading ${files.length} images...`;

      let okCount = 0;
      let failCount = 0;
      for(const f of files){
        try{
          await uploadBlob(f, f.name || "import.jpg");
          okCount++;
        }catch(e){
          console.error(e);
          failCount++;
        }
      }

      statusEl.textContent = `Import done: success ${okCount}, failed ${failCount}, total ${count}`;
      btnUploadFiles.disabled = false;
      fileImages.value = "";
    }

    async function finalize(){
      btnFinalize.disabled = true;
      statusEl.textContent = "Finalizing...";
      const r = await fetch(`/api/enroll/${sessionId}/finalize`, {method: "POST"});
      const ct = (r.headers.get("content-type") || "").toLowerCase();
      let j = null;
      if(ct.includes("application/json")){
        j = await r.json();
      } else {
        const t = await r.text();
        throw new Error(t.slice(0, 200));
      }
      if(!j.ok){
        alert(j.error || "finalize failed");
        btnFinalize.disabled = false;
        statusEl.textContent = "Finalize failed.";
        return;
      }
      alert(`Enrollment complete. Templates saved: ${j.templates_saved}`);
      window.location.href = "/employees";
    }

    btnStart.addEventListener("click", () => startCam().catch(e => alert(e)));
    btnCapture.addEventListener("click", () => capture().catch(e => alert(e)));
    btnUploadFiles.addEventListener("click", () => uploadSelectedFiles().catch(e => alert(e)));
    btnFinalize.addEventListener("click", () => finalize().catch(e => alert(e)));
  </script>
{% endblock %}
